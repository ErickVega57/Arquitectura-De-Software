spring.application.name=proyecto-arquitectura

# Puerto del servidor embebido
server.port=8080

# Conexión a MySQL / MariaDB en XAMPP
spring.datasource.url=jdbc:mysql://localhost:3306/tienda_juguetes?useSSL=false&serverTimezone=America/Merida&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=

# Driver explícito (opcional en Spring Boot 3+, útil para dejarlo claro)
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver